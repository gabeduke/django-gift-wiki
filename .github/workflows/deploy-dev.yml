name: Deploy Review Environment (Dev)

on:
  pull_request:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PROJECT: wikileet
      GOOGLE_PROJECT_ID: wikileet
      GOOGLE_CLOUD_QUOTA_PROJECT: wikileet
      # Ensure Makefile uses the runner's gcloud
      GCLOUD: gcloud
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Recreate Dev Secrets Environment
        run: |
          mkdir -p deploy/dev
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> deploy/dev/secrets.env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> deploy/dev/secrets.env
          echo "DJANGO_DB_USER=${{ secrets.DJANGO_DB_USER }}" >> deploy/dev/secrets.env
          echo "DJANGO_DB_PASSWORD=${{ secrets.DJANGO_DB_PASSWORD }}" >> deploy/dev/secrets.env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> deploy/dev/secrets.env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" > .env
          echo "CLOUDSDK_CORE_PROJECT=wikileet" >> .env

      - name: Deploy Dev
        run: make dev
