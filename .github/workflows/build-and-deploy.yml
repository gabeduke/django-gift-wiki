name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: dukeman/gift-wiki
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for commit SHA

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{sha}}
            type=raw,value={{branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get short commit SHA
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "kustomization=deploy/prod/kustomization.yaml" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "kustomization=deploy/dev/kustomization.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Update kustomization.yaml with new image tag
        run: |
          KUSTOMIZATION_FILE="${{ steps.env.outputs.kustomization }}"
          COMMIT_SHA="${{ steps.commit.outputs.sha }}"
          
          # Update the image tag in kustomization.yaml
          if [ -f "$KUSTOMIZATION_FILE" ]; then
            # Replace the newTag value (Linux sed syntax for GitHub Actions)
            sed -i "s/newTag:.*/newTag: ${COMMIT_SHA}/" "$KUSTOMIZATION_FILE"
            
            echo "✅ Updated $KUSTOMIZATION_FILE with image tag: ${COMMIT_SHA}"
            echo "📝 Updated file contents:"
            cat "$KUSTOMIZATION_FILE"
          else
            echo "❌ Error: $KUSTOMIZATION_FILE not found"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "${{ steps.env.outputs.kustomization }}"
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tag to ${{ steps.commit.outputs.sha }} for ${{ steps.env.outputs.environment }}"
            git push
          fi

      - name: Output image tag
        run: |
          echo "✅ Built and pushed image: ${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}"
          echo "✅ Updated ${{ steps.env.outputs.kustomization }} with new tag"
          echo "🚀 ArgoCD will automatically sync and deploy the new image"

