name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PROJECT: wikileet
      GOOGLE_PROJECT_ID: wikileet
      GOOGLE_CLOUD_QUOTA_PROJECT: wikileet
      GCLOUD: gcloud
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Recreate Production Secrets Environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DJANGO_DB_USER: ${{ secrets.DJANGO_DB_USER }}
          DJANGO_DB_PASSWORD: ${{ secrets.DJANGO_DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          mkdir -p deploy/prod
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> deploy/prod/secrets.env
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> deploy/prod/secrets.env
          echo "DJANGO_DB_USER=$DJANGO_DB_USER" >> deploy/prod/secrets.env
          echo "DJANGO_DB_PASSWORD=$DJANGO_DB_PASSWORD" >> deploy/prod/secrets.env
          echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> deploy/prod/secrets.env
          echo "FIREBASE_API_KEY=$FIREBASE_API_KEY" > .env
          echo "CLOUDSDK_CORE_PROJECT=wikileet" >> .env

      - name: Set Terraform Secret Variables
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DB_USER: ${{ secrets.DJANGO_DB_USER }}
          DJANGO_DB_PASSWORD: ${{ secrets.DJANGO_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          TF_VAR_secret_values=$(jq -cn \
            --arg dsk "$DJANGO_SECRET_KEY" \
            --arg dbu "$DJANGO_DB_USER" \
            --arg dbp "$DJANGO_DB_PASSWORD" \
            --arg aki "$AWS_ACCESS_KEY_ID" \
            --arg ask "$AWS_SECRET_ACCESS_KEY" \
            '{"django-secret-key":$dsk,"django-db-user":$dbu,"django-db-password":$dbp,"aws-access-key-id":$aki,"aws-secret-access-key":$ask}')
          echo "TF_VAR_secret_values=$TF_VAR_secret_values" >> $GITHUB_ENV

      - name: Apply Terraform (prod)
        run: |
          make terraform-init ENV=prod
          cd terraform && terraform workspace select prod
          cd terraform && terraform apply -auto-approve -var-file="prod.tfvars"

      - name: Deploy Cloud Run (prod)
        run: |
          SUBS="^;^"
          SUBS+="_SERVICE_NAME=${{ vars.PROD_SERVICE_NAME }};"
          SUBS+="_REGION=${{ vars.PROD_REGION }};"
          SUBS+="_DB_HOST=${{ vars.PROD_DB_HOST }};"
          SUBS+="_DB_NAME=${{ vars.PROD_DB_NAME }};"
          SUBS+="_FIREBASE_API_KEY_SECRET=${{ vars.PROD_FIREBASE_API_KEY_SECRET }};"
          SUBS+="_ALLOWED_USERS_SECRET=${{ vars.PROD_ALLOWED_USERS_SECRET }};"
          SUBS+="_ALLOWED_HOSTS=${{ vars.PROD_ALLOWED_HOSTS }};"
          SUBS+="_ALLOWED_ORIGINS=${{ vars.PROD_ALLOWED_ORIGINS }}"
          gcloud builds submit --config=cloudbuild.yaml --substitutions="${SUBS}"
