name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install pipenv
      run: pip install pipenv
      
    - name: Install dependencies
      run: pipenv install --dev
      
    - name: Run linter
      run: make lint
      
    - name: Run tests
      run: make test
