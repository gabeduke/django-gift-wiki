name: CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run linter
        run: make lint

      - name: Check migrations are committed and up to date
        run: |
          pipenv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: make test

  deploy-dev:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    env:
      GOOGLE_PROJECT: wikileet
      GOOGLE_PROJECT_ID: wikileet
      GOOGLE_CLOUD_QUOTA_PROJECT: wikileet
      GCLOUD: gcloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Recreate Dev Secrets Environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DJANGO_DB_USER: ${{ secrets.DJANGO_DB_USER }}
          DJANGO_DB_PASSWORD: ${{ secrets.DJANGO_DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          mkdir -p deploy/dev
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> deploy/dev/secrets.env
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> deploy/dev/secrets.env
          echo "DJANGO_DB_USER=$DJANGO_DB_USER" >> deploy/dev/secrets.env
          echo "DJANGO_DB_PASSWORD=$DJANGO_DB_PASSWORD" >> deploy/dev/secrets.env
          echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> deploy/dev/secrets.env
          echo "FIREBASE_API_KEY=$FIREBASE_API_KEY" > .env
          echo "CLOUDSDK_CORE_PROJECT=wikileet" >> .env

      - name: Set Terraform Secret Variables
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DB_USER: ${{ secrets.DJANGO_DB_USER }}
          DJANGO_DB_PASSWORD: ${{ secrets.DJANGO_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          TF_VAR_secret_values=$(jq -cn \
            --arg dsk "$DJANGO_SECRET_KEY" \
            --arg dbu "$DJANGO_DB_USER" \
            --arg dbp "$DJANGO_DB_PASSWORD" \
            --arg aki "$AWS_ACCESS_KEY_ID" \
            --arg ask "$AWS_SECRET_ACCESS_KEY" \
            '{"django-secret-key":$dsk,"django-db-user":$dbu,"django-db-password":$dbp,"aws-access-key-id":$aki,"aws-secret-access-key":$ask}')
          echo "TF_VAR_secret_values=$TF_VAR_secret_values" >> $GITHUB_ENV

      - name: Apply Terraform (dev)
        run: |
          make terraform-init ENV=dev
          cd terraform
          terraform workspace select dev
          terraform apply -auto-approve -var-file="dev.tfvars"

      - name: Deploy Cloud Run (dev)
        run: |
          SUBS="^;^"
          SUBS+="_SERVICE_NAME=${{ vars.SERVICE_NAME }};"
          SUBS+="_REGION=${{ vars.REGION }}"
          gcloud builds submit --config=cloudbuild.yaml --substitutions="${SUBS}"
