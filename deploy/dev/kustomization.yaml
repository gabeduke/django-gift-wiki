apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wikileet-dev

commonLabels:
  app: wikileet
  environment: dev

resources:
  - ../base

# Secrets are managed separately in homelab repo and applied via 'make secrets'
# The 'django-app-secrets' secret must exist in wikileet-dev namespace before deployment

configMapGenerator:
  - name: django-app-config
    behavior: create
    envs:
    - config.env

# Image tag will be updated by GitHub Actions with commit SHA
# Format: dukeman/gift-wiki:<short-sha>
images:
  - name: dukeman/gift-wiki
    newTag: latest  # This will be replaced by GitHub Actions with commit SHA

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: wikileet-firebase
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "giftwiki-dev.leetserve.com"
      - op: replace
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "giftwiki-dev-42be6.web.app"
  - target:
      group: ""
      version: v1
      kind: Service
      name: firebase-hosting
    patch: |-
      - op: replace
        path: /spec/externalName
        value: "giftwiki-dev-42be6.web.app"
