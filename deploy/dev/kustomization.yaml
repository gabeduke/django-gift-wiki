apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wikileet-dev

resources:
  - ../base

# Secrets are managed separately in homelab repo and applied via 'make secrets'
# The 'django-app-secrets' secret must exist in wikileet-dev namespace before deployment

configMapGenerator:
  - name: django-app-config
    behavior: create
    envs:
    - config.env

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: django-app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "giftwiki-dev.leetserve.com"
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - "giftwiki-dev.leetserve.com"
            secretName: gift-wiki-tls
