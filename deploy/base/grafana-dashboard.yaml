            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "histogram_quantile(0.99, sum(rate(wikileet_http_request_duration_seconds_bucket[5m])) by (le, endpoint, environment))",
              "legendFormat": "{{environment}} - P99 - {{endpoint}}",
              "refId": "C"
