apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: django-app
spec:
  selector:
    matchLabels:
      app: django-app
  serviceName: "django-app"
  replicas: 1
  template:
    metadata:
      labels:
        app: django-app
    spec:
      initContainers:
        - name: migrate
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              python manage.py migrate --noinput
              # Import scraped wiki data if available and not already imported
              if [ -f /app/scraped_wiki_data.json ]; then
                python manage.py import_scraped_wiki /app/scraped_wiki_data.json || echo "Warning: import_scraped_wiki failed, continuing..."
              else
                echo "Warning: scraped_wiki_data.json not found, skipping import"
              fi
          env:
            - name: DATABASE_PATH
              value: /app/db/db.sqlite3
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/db
      containers:
        - name: django-app
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/db/db.sqlite3
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/db  # Ensure this matches the path where your SQLite database is stored
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: django-app-db
