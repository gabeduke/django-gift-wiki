apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: wikileet

resources:
    # Direct k3s serving (Firebase Hosting disabled — domain flagged as phishing)
    - deployment.yaml   # Stateless Deployment with Neon PostgreSQL
    - service.yaml
    - ingress.yaml
    # Firebase Hosting resources disabled
    # - ingress-firebase.yaml
    # - ingress-firebase-preview.yaml
    # Legacy resources (not needed with Neon PostgreSQL)
    # - statefulset.yaml
    # - pvc.yaml
    # Monitoring (optional)
    # - servicemonitor.yaml
    # - grafana-dashboard.yaml

# Secrets are managed separately in homelab repo and applied via 'make secrets'
# They are created as 'django-app-secrets' in the target namespace

# ConfigMaps are overridden in dev/prod overlays with environment-specific values
# Base template is kept for reference but not used directly
