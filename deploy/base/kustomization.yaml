apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: gift-wiki

resources:
    - storageclass.yaml
    - statefulset.yaml
    - pvc.yaml
    # migration-job.yaml removed - migrations now run as init container
    # deployment.yaml removed - using StatefulSet for better RWO volume handling
    - service.yaml
    - ingress.yaml

secretGenerator:
  - name: django-app-secrets
    envs:
      - secrets.env-tpl

configMapGenerator:
  - name: django-app-config
    envs:
      - config.env-tpl
