apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: gift-wiki

resources:
    - statefulset.yaml
    - pvc.yaml
    # migration-job.yaml removed - migrations now run as init container
    # deployment.yaml removed - using StatefulSet for better RWO volume handling
    # storageclass.yaml removed - managed in homelab/clusters/iot/namespace-longhorn-system
    - service.yaml
    - ingress.yaml

# Secrets are managed separately in homelab repo and applied via 'make secrets'
# They are created as 'django-app-secrets' in the target namespace

# ConfigMaps are overridden in dev/prod overlays with environment-specific values
# Base template is kept for reference but not used directly
