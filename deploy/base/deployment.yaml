apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikileet
spec:
  replicas: 2  # Can scale to multiple replicas with Neon (no PVC dependency)
  selector:
    matchLabels:
      app: wikileet
  template:
    metadata:
      labels:
        app: wikileet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: django-app
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

