apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikileet
spec:
  replicas: 2  # Can scale to multiple replicas with Neon (no PVC dependency)
  selector:
    matchLabels:
      app: wikileet
  template:
    metadata:
      labels:
        app: wikileet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: django-app
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Probes intentionally use /health/ (process liveness, no DB query).
          # Do NOT point these at /health/db/: a per-5s DB query resets Neon's
          # autosuspend timer and pins the compute awake 24/7.
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            timeoutSeconds: 5
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            timeoutSeconds: 5
            periodSeconds: 5

