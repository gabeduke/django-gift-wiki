apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 1  # Using 1 replica with RWO (ReadWriteOnce) volume
  # Once Longhorn RWX is working, can scale to 2+ replicas for HA
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      initContainers:
        - name: migrate
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: DATABASE_PATH
              value: /app/db/db.sqlite3
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: django-app
          image: dukeman/gift-wiki:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/db/db.sqlite3
          envFrom:
            - secretRef:
                name: django-app-secrets
            - configMapRef:
                name: django-app-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/db
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: django-app-db

