apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wikileet

commonLabels:
  app: wikileet
  environment: prod

resources:
  - ../base

# Secrets are managed separately in homelab repo and applied via 'make secrets'
# The 'django-app-secrets' secret must exist in wikileet namespace before deployment

configMapGenerator:
  - name: django-app-config
    behavior: create
    envs:
    - config.env

# Image tag will be updated by GitHub Actions with commit SHA
# Format: dukeman/gift-wiki:<short-sha>
images:
  - name: dukeman/gift-wiki
    newTag: latest  # This will be replaced by GitHub Actions with commit SHA

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: wikileet
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "giftwiki.leetserve.com"
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - "giftwiki.leetserve.com"
            secretName: gift-wiki-tls
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: "wikileet"
